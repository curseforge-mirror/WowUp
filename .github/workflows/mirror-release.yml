name: Mirror release (Windows)

# curseforge-mirror: builds the unsigned Windows installers for the version in wowup-electron/package.json and
# uploads them to a draft GitHub release on this repo. Publishing the draft is what installed apps update from.
# Manual on purpose: a tag trigger on a fork can fire for every upstream tag that gets pushed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Build and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_SIGNING_KEY: ${{ secrets.BUNDLE_SIGNING_KEY }}
          BUNDLE_SIGNING_KEY_ID: ${{ secrets.BUNDLE_SIGNING_KEY_ID }}
        run: |
          cd wowup-lib && npm install && npm run build
          cd ../wowup-shell && npm ci
          cd ../wowup-electron && npm install && npm run lint && npm run build:prod
          cd ../wowup-shell && npm run electron:publish
